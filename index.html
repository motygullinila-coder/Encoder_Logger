<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">
    <title>Encoder</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d10;
            color: #e8edf2;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }
        .container {
            width: min(90vw, 520px);
            text-align: center;
        }
        .position {
            font-size: clamp(64px, 16vw, 110px);
            font-weight: 300;
            letter-spacing: -4px;
            line-height: 1;
            white-space: nowrap;
        }
        .unit {
            margin-left: 8px;
            font-size: 22px;
            color: #7d8791;
            letter-spacing: 0;
        }
        .ticks {
            margin-top: 24px;
            font-size: 16px;
            color: #68727c;
            font-variant-numeric: tabular-nums;
        }
        .reference {
            width: 8px;
            height: 8px;
            margin: 28px auto 0;
            border-radius: 50%;
            background: #30363d;
            transition: 0.15s;
        }
        .reference.active {
            background: #ffffff;
            box-shadow:
                0 0 8px #ffffff,
                0 0 20px rgba(255,255,255,0.5);
        }
        .status {
            margin-top: 12px;
            font-size: 11px;
            color: #454c54;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="position">
            <span id="position">0.000</span>
            <span class="unit">mm</span>
        </div>
        <div class="ticks">
            <span id="ticks">0</span>
        </div>
        <div id="reference" class="reference"></div>
        <div id="status" class="status">
            connected
        </div>
    </main>
    <script>
        async function updateEncoder() {
            try {
                const response = await fetch("/encoder", {
                    cache: "no-store"
                });
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                const data = await response.json();

                document.getElementById("position").textContent =
                    data.position.toFixed(3);

                document.getElementById("ticks").textContent =
                    data.ticks;

                const reference = document.getElementById("reference");

                if (data.reference) {
                    reference.classList.add("active");
                } else {
                    reference.classList.remove("active");
                }

                document.getElementById("status").textContent =
                    "connected";
            }
            catch (error) {
                document.getElementById("status").textContent =
                    "connection lost";

            }
        }
        updateEncoder();
        setInterval(updateEncoder, 100);
    </script>
</body>
</html>
